<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Flower Shop</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .contact-container { padding: 100px 9%; display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; }
        .contact-form { flex: 1 1 40rem; background: #fff; padding: 2rem; border-radius: .5rem; box-shadow: 0 .5rem 1rem rgba(0,0,0,.1); }
        .contact-form h2 { font-size: 3rem; color: #333; margin-bottom: 1rem; }
        .contact-form .input-box { width: 100%; border: 1px solid #ccc; padding: 1rem; font-size: 1.6rem; margin: .7rem 0; border-radius: .5rem; }
        .contact-form textarea { height: 15rem; resize: none; }
        .contact-info { flex: 1 1 30rem; }
        .contact-info h3 { font-size: 2.5rem; color: #333; margin-bottom: 1rem; }
        .contact-info p { font-size: 1.6rem; color: #666; margin-bottom: 2rem; line-height: 1.8; }
        .contact-info i { color: #e84393; margin-right: 1rem; }
    </style>
</head>
<body>

<section class="contact-container">
    <div class="contact-info">
        <h3>Get in Touch</h3>
        <p>Feel free to contact us anytime. We will get back to you as soon as possible!</p>
        <p><i class="fas fa-envelope"></i> fatma@example.com</p>
        <p><i class="fas fa-phone"></i> +20 123 456 789</p>
        <p><i class="fas fa-map-marker-alt"></i> Ismailia, Egypt</p>
    </div>

    <form class="contact-form" id="contactForm">
        <h2>Send Message</h2>
        <input type="text" id="name" placeholder="Name" class="input-box" required>
        <input type="email" id="email" placeholder="Email" class="input-box" required>
        <textarea id="message" placeholder="Your Message" class="input-box" required></textarea>
        <button type="submit" class="btn">Send Now</button>
    </form>
</section>

<script type="module" src="./js/contact.js"></script>
</body>
</html>
