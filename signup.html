<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Flower Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { padding: 100px 9%; display: flex; justify-content: center; }
        .auth-form { 
            background: #fff; padding: 2rem; border-radius: .5rem; 
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.1); width: 100%; max-width: 400px; 
        }
        .auth-form h3 { font-size: 2.2rem; margin-bottom: 1rem; color: #333; text-align: center; }
        .auth-form input { 
            width: 100%; padding: 1rem; margin: .8rem 0; 
            border: 1px solid #ccc; border-radius: .5rem; font-size: 1.6rem; 
        }
        .auth-form p { font-size: 1.4rem; margin-top: 1rem; text-align: center; }
        .auth-form p a { color: #e84393; text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <form class="auth-form" id="signupForm">
        <h3>Create Account</h3>
        <input type="text" id="username" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn" style="width: 100%;">Sign Up</button>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </form>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = {
        name: document.getElementById('username').value,
        email: document.getElementById('email').value,
        pass: document.getElementById('password').value
    };
    // تخزين بيانات المستخدم
    localStorage.setItem('userData', JSON.stringify(user));
    alert('Account created successfully! ');
    window.location.href = 'login.html';
});
</script>
<script type="module" src="./js/firebase.js"></script>
</body>
</html>
