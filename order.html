<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Flower Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .orders-container { padding: 100px 9%; background: #f9f9f9; min-height: 80vh; }
        .orders-container h2 { font-size: 3rem; color: #333; margin-bottom: 2rem; }
        .order-card { 
            background: #fff; padding: 2rem; border-radius: .5rem; 
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.05); margin-bottom: 2rem;
            border-left: 5px solid #e84393; 
        }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        .order-header h3 { font-size: 1.8rem; color: #333; }
        .order-header span { font-size: 1.4rem; color: #666; }
        .order-details p { font-size: 1.6rem; color: #444; margin: .5rem 0; }
        .order-items { margin-top: 1rem; padding-left: 1rem; }
        .order-items li { font-size: 1.4rem; color: #777; list-style: disc; }
        .order-total { font-weight: bold; color: #e84393; font-size: 1.8rem; margin-top: 1rem; text-align: right; }
    </style>
</head>
<body>

<section class="orders-container">
    <h2>Your Order History</h2>
    <div id="orders-list">
        <!-- الطلبات هتظهر هنا بالـ JS -->
    </div>
</section>

<script type="module" src="./js/order.js"></script>
</body>
</html>
