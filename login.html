<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Flower Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* نفس الـ Style بتاع الـ Signup */
        .auth-container { padding: 100px 9%; display: flex; justify-content: center; }
        .auth-form { 
            background: #fff; padding: 2rem; border-radius: .5rem; 
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.1); width: 100%; max-width: 400px; 
        }
        .auth-form h3 { font-size: 2.2rem; margin-bottom: 1rem; color: #333; text-align: center; }
        .auth-form input { 
            width: 100%; padding: 1rem; margin: .8rem 0; 
            border: 1px solid #ccc; border-radius: .5rem; font-size: 1.6rem; 
        }
        .auth-form p { font-size: 1.4rem; margin-top: 1rem; text-align: center; }
        .auth-form p a { color: #e84393; text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <form class="auth-form" id="loginForm">
        <h3>Login</h3>
        <input type="email" id="loginEmail" placeholder="Email Address" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
        <p>Don't have an account? <a href="signup.html">Sign up now</a></p>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPassword').value;

    const storedUser = JSON.parse(localStorage.getItem('userData'));

    if (storedUser && storedUser.email === email && storedUser.pass === pass) {
        alert(`Welcome back, ${storedUser.name}! `);
        // حفظ حالة تسجيل الدخول
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'index.html';
    } else {
        alert('Invalid email or password! ');
    }
});
</script>
<script src="js/firebase.js"></script>
</body>
</html>
